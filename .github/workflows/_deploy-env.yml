name: Deploy environment (reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: dev | test | prod
        required: true
        type: string
      sha:
        description: Commit SHA to check out
        required: true
        type: string
      artifact:
        description: Name of the build artifact to deploy
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.url.outputs.url }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: apps
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.x"
          terraform_wrapper: false
      - name: Check AWS credentials are configured
        env:
          HAS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
          HAS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY != '' }}
        run: |
          if [[ "$HAS_KEY" != "true" || "$HAS_SECRET" != "true" ]]; then
            echo "::error::AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY are missing in the '${{ inputs.environment }}' GitHub environment. Run scripts/setup-github.sh."
            exit 1
          fi
      # ENVIRONMENT secrets of the job's `environment:`; the caller must pass `secrets: inherit`
      # (see deploy.yml) or this context is empty.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy
        run: scripts/deploy.sh "${{ inputs.environment }}" --auto-approve --skip-build
      - name: Resolve URL
        id: url
        run: |
          echo "url=https://$(terraform -chdir="infra/terraform/envs/${{ inputs.environment }}" output -raw cloudfront_domain)" >> "$GITHUB_OUTPUT"
